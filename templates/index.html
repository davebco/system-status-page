<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>System Status</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 600;
      color: #f8fafc;
    }

    #clock {
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #38bdf8;
      font-variant-numeric: tabular-nums;
      margin: 0.25rem 0;
    }

    #date-tz {
      font-size: 0.9rem;
      color: #94a3b8;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 1rem;
      width: 100%;
      max-width: 1100px;
    }

    .card-top  { grid-column: span 2; }
    .card-mid  { grid-column: span 3; }
    .card-wide { grid-column: span 6; }

    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr; }
      .card-top, .card-mid, .card-wide { grid-column: span 1; }
    }

    .card {
      background: #1e2330;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
    }

    .card-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      margin-bottom: 0.5rem;
    }

    .card-value {
      font-size: 1.5rem;
      font-weight: 600;
      color: #f1f5f9;
    }

    .card-sub {
      font-size: 0.8rem;
      color: #94a3b8;
      margin-top: 0.2rem;
    }

    .bar-wrap {
      background: #2d3748;
      border-radius: 999px;
      height: 8px;
      margin-top: 0.75rem;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      border-radius: 999px;
      transition: width 0.4s ease;
    }

    .bar-cpu  { background: #38bdf8; }
    .bar-mem  { background: #818cf8; }
    .bar-disk { background: #34d399; }

    .cpu-spark {
      display: block;
      width: 100%;
      height: 36px;
      margin-top: 0.6rem;
    }

    .container-list {
      margin-top: 0.75rem;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.35rem 1.5rem;
    }

    .container-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      color: #cbd5e1;
    }

    .container-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-running { background: #34d399; }
    .dot-exited  { background: #f87171; }
    .dot-other   { background: #fb923c; }

    .backup-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin-right: 0.5rem;
      vertical-align: middle;
      background: #64748b;
    }

    .bk-ok      { background: #34d399; }
    .bk-warn    { background: #fb923c; }
    .bk-fail    { background: #f87171; }
    .bk-unknown { background: #64748b; }

    .backup-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem 1.5rem;
      margin-top: 0.75rem;
      font-size: 0.78rem;
      color: #cbd5e1;
    }

    /* No background here: the bk-* colour rules above are the same specificity,
       so a background set here would win over bk-ok and pin the dot grey.
       The markup ships with bk-unknown, which supplies the grey default. */
    .cert-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      margin-right: 0.5rem;
      vertical-align: middle;
    }

    .cert-list {
      margin-top: 0.75rem;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.35rem 1.5rem;
    }

    .cert-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      color: #cbd5e1;
    }

    .cert-days {
      margin-left: auto;
      color: #94a3b8;
      white-space: nowrap;
    }

    .bar.warn  { background: #fb923c; }
    .bar.danger { background: #f87171; }

    #status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34d399;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <header>
    <h1><span id="status-dot"></span>System Status</h1>
    <div id="clock">--:--:--</div>
    <div id="date-tz">Loading...</div>
  </header>

  <div class="grid">
    <div class="card card-top">
      <div class="card-label">Host</div>
      <div class="card-value" id="hostname">—</div>
      <div class="card-sub" id="os">—</div>
    </div>

    <div class="card card-top">
      <div class="card-label">Uptime</div>
      <div class="card-value" id="uptime">—</div>
    </div>

    <div class="card card-top">
      <div class="card-label">CPU Usage</div>
      <div class="card-value" id="cpu-pct">—</div>
      <div class="card-sub" id="cpu-count">—</div>
      <div class="bar-wrap"><div class="bar bar-cpu" id="cpu-bar" style="width:0%"></div></div>
      <svg id="cpu-spark" class="cpu-spark" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true">
        <polyline id="cpu-spark-line" fill="none" stroke="#38bdf8" stroke-width="1.5" vector-effect="non-scaling-stroke" points="" />
      </svg>
    </div>

    <div class="card card-mid">
      <div class="card-label">Memory</div>
      <div class="card-value" id="mem-pct">—</div>
      <div class="card-sub" id="mem-detail">—</div>
      <div class="bar-wrap"><div class="bar bar-mem" id="mem-bar" style="width:0%"></div></div>
    </div>

    <div class="card card-mid">
      <div class="card-label">Disk</div>
      <div class="card-value" id="disk-pct">—</div>
      <div class="card-sub" id="disk-detail">—</div>
      <div class="bar-wrap"><div class="bar bar-disk" id="disk-bar" style="width:0%"></div></div>
    </div>

    <div class="card card-wide">
      <div class="card-label">Backups &middot; qb-backup &rarr; NAS</div>
      <div class="card-value"><span class="backup-dot bk-unknown" id="backup-dot"></span><span id="backup-state">&mdash;</span></div>
      <div class="card-sub" id="backup-message">&mdash;</div>
      <div class="backup-meta" id="backup-meta"></div>
    </div>

    <div class="card card-wide">
      <div class="card-label">Certificates &middot; expiry</div>
      <div class="card-value"><span class="cert-dot bk-unknown" id="cert-dot"></span><span id="cert-state">&mdash;</span></div>
      <div class="card-sub" id="cert-message">&mdash;</div>
      <div class="cert-list" id="cert-list"></div>
    </div>

    <div class="card card-wide">
      <div class="card-label">Containers</div>
      <div class="card-value" id="containers-total">—</div>
      <div class="card-sub" id="containers-summary">—</div>
      <div class="container-list" id="container-list"></div>
    </div>
  </div>

  <footer>Updates every 5 seconds</footer>

  <script>
    const CPU_HISTORY_MAX = 60; // 60 samples × 5s = 5 min
    const cpuHistory = [];

    function renderCpuSpark(history) {
      const line = document.getElementById('cpu-spark-line');
      if (history.length < 2) { line.setAttribute('points', ''); return; }
      const stepX = 100 / (CPU_HISTORY_MAX - 1);
      const offset = CPU_HISTORY_MAX - history.length;
      const points = history
        .map((v, i) => `${((offset + i) * stepX).toFixed(2)},${(30 - (Math.max(0, Math.min(100, v)) / 100) * 30).toFixed(2)}`)
        .join(' ');
      line.setAttribute('points', points);
    }

    const BACKUP_STATE_TEXT = { ok: 'Healthy', warn: 'Attention', fail: 'Failing', unknown: 'Unknown' };

    function renderBackup(b) {
      const dot = document.getElementById('backup-dot');
      const state = (b && b.state) || 'unknown';
      dot.className = 'backup-dot bk-' + state;
      document.getElementById('backup-state').textContent = BACKUP_STATE_TEXT[state] || state;
      document.getElementById('backup-message').textContent = (b && b.message) || 'No data';

      const bits = [];
      if (b && b.age_hours !== null && b.age_hours !== undefined) bits.push(`${b.age_hours}h ago`);
      if (b && b.latest_size_gb) bits.push(`${b.latest_size_gb} GB last run`);
      if (b && b.daily_count) bits.push(`${b.daily_count} daily kept`);
      if (b && b.weekly_count) bits.push(`${b.weekly_count} weekly kept`);
      if (b && b.latest_weekly) bits.push(`newest weekly ${b.latest_weekly}`);
      if (b && b.share) bits.push(`share ${b.share.used_gb} GB / ${b.share.total_gb} GB (${b.share.percent}%)`);
      const meta = document.getElementById('backup-meta');
      meta.replaceChildren(...bits.map(t => {
        const span = document.createElement('span');
        span.textContent = t;  // names come off disk — never interpolate into HTML
        return span;
      }));
    }

    const CERT_STATE_TEXT = { ok: 'All valid', warn: 'Renew soon', fail: 'Expired', unknown: 'Unknown' };

    function renderCerts(c) {
      const state = (c && c.state) || 'unknown';
      document.getElementById('cert-dot').className = 'cert-dot bk-' + state;
      document.getElementById('cert-state').textContent = CERT_STATE_TEXT[state] || state;
      document.getElementById('cert-message').textContent = (c && c.message) || 'No data';

      const list = document.getElementById('cert-list');
      list.replaceChildren(...((c && c.certs) || []).map(item => {
        const row = document.createElement('div');
        row.className = 'cert-row';
        const dot = document.createElement('span');
        dot.className = 'container-dot bk-' + item.state;
        const days = document.createElement('span');
        days.className = 'cert-days';
        days.textContent = item.days_left === undefined
          ? (item.message || 'unreachable')
          : `${item.days_left}d · ${item.expires}`;
        // labels and issuers come off the wire — never interpolate into HTML
        row.title = `${item.target}${item.issuer ? ' — issued by ' + item.issuer : ''}`;
        row.append(dot, item.label, days);
        return row;
      }));
    }

    function setBar(barEl, pct) {
      barEl.style.width = pct + '%';
      barEl.classList.remove('warn', 'danger');
      if (pct >= 90) barEl.classList.add('danger');
      else if (pct >= 75) barEl.classList.add('warn');
    }

    function updateClock(isoTime) {
      const d = new Date(isoTime);
      document.getElementById('clock').textContent = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
      document.getElementById('date-tz').textContent = `${d.toLocaleDateString()}  ·  ${Intl.DateTimeFormat().resolvedOptions().timeZone}`;
    }

    async function fetchStats() {
      try {
        const res = await fetch('/api/stats');
        const d = await res.json();

        updateClock(d.time);
        document.getElementById('hostname').textContent = d.hostname;
        document.getElementById('os').textContent = d.os;
        document.getElementById('uptime').textContent = d.uptime;

        document.getElementById('cpu-pct').textContent = d.cpu_percent + '%';
        document.getElementById('cpu-count').textContent = `${d.cpu_count} logical cores`;
        setBar(document.getElementById('cpu-bar'), d.cpu_percent);
        cpuHistory.push(d.cpu_percent);
        if (cpuHistory.length > CPU_HISTORY_MAX) cpuHistory.shift();
        renderCpuSpark(cpuHistory);

        document.getElementById('mem-pct').textContent = d.mem_percent + '%';
        document.getElementById('mem-detail').textContent = `${d.mem_used_gb} GB / ${d.mem_total_gb} GB`;
        setBar(document.getElementById('mem-bar'), d.mem_percent);

        document.getElementById('disk-pct').textContent = d.disk_percent + '%';
        document.getElementById('disk-detail').textContent = `${d.disk_used_gb} GB / ${d.disk_total_gb} GB`;
        setBar(document.getElementById('disk-bar'), d.disk_percent);

        renderBackup(d.backup);
        renderCerts(d.certs);

        if (d.docker) {
          const dk = d.docker;
          document.getElementById('containers-total').textContent = dk.total;
          document.getElementById('containers-summary').textContent =
            `${dk.counts.running} running · ${dk.counts.exited} stopped` +
            (dk.counts.other > 0 ? ` · ${dk.counts.other} other` : '');
          const list = document.getElementById('container-list');
          list.replaceChildren(...dk.containers.map(c => {
            const dotClass = c.status === 'running' ? 'dot-running' : c.status === 'exited' ? 'dot-exited' : 'dot-other';
            const row = document.createElement('div');
            row.className = 'container-row';
            const dot = document.createElement('span');
            dot.className = 'container-dot ' + dotClass;
            row.append(dot, c.name);  // container names come from Docker — never interpolate into HTML
            return row;
          }));
        } else {
          document.getElementById('containers-total').textContent = 'N/A';
          document.getElementById('containers-summary').textContent = 'Docker socket unavailable';
        }
      } catch (e) {
        console.error('Failed to fetch stats:', e);
      }
    }

    fetchStats();
    setInterval(fetchStats, 5000);
  </script>
</body>
</html>
